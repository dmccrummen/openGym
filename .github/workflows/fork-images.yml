name: Fork images (muscle feedback)

# Builds this fork's own images into its owner's GitHub Container Registry, for the self-hosted
# server to pull instead of the upstream ones:
#   ghcr.io/<owner>/opengym-api:feedback
#   ghcr.io/<owner>/opengym-web:feedback
#   ghcr.io/<owner>/opengym-mcp:feedback
# plus a `feedback-<short sha>` tag of each push, to go back to an earlier build.
# A separate file from docker-publish.yml on purpose, so merging upstream never conflicts here.
# amd64 only: the NAS it runs on is x86, and the arm64 build under emulation takes far longer.
on:
  push:
    branches: [muscle-feedback]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
          - image: mcp
            context: .
            file: ./mcp/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase owner (registry names must be lowercase)
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Version metadata
        id: meta
        run: |
          echo "VERSION=feedback-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          pull: true
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.meta.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/opengym-${{ matrix.image }}:feedback
            ghcr.io/${{ steps.repo.outputs.owner }}/opengym-${{ matrix.image }}:feedback-${{ steps.meta.outputs.SHORT }}
          cache-from: type=gha,scope=fork-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.image }}
